<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>easyNote</title>
<meta name="description" content="Handwriting whiteboard and math notes.">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f6fed%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="toolbar" role="toolbar" aria-label="Drawing tools">
    <button id="btn-sidebar" class="tb" type="button" aria-label="Notes list" title="Notes">&#9776;</button>
    <div class="group" id="tools" role="group" aria-label="Tool">
      <button class="tb tool" type="button" data-tool="pen" aria-pressed="true" title="Pen">Pen</button>
      <button class="tb tool" type="button" data-tool="highlighter" aria-pressed="false" title="Highlighter">Hi</button>
      <button class="tb tool" type="button" data-tool="eraser" aria-pressed="false" title="Eraser">Erase</button>
      <button class="tb tool" type="button" data-tool="lasso" aria-pressed="false" title="Lasso">Lasso</button>
      <button class="tb tool" type="button" data-tool="hand" aria-pressed="false" title="Hand (pan)">Hand</button>
    </div>
    <div class="group" id="colors" role="group" aria-label="Colour"></div>
    <div class="group" id="sizes" role="group" aria-label="Size">
      <button class="tb size" type="button" data-size="S" aria-pressed="false" title="Small">S</button>
      <button class="tb size" type="button" data-size="M" aria-pressed="true" title="Medium">M</button>
      <button class="tb size" type="button" data-size="L" aria-pressed="false" title="Large">L</button>
    </div>
    <div class="group">
      <button id="btn-undo" class="tb" type="button" aria-label="Undo" title="Undo" disabled>&#8630;</button>
      <button id="btn-redo" class="tb" type="button" aria-label="Redo" title="Redo" disabled>&#8631;</button>
    </div>
    <div class="group" id="mode" role="group" aria-label="Mode">
      <button class="tb mode" type="button" data-mode="notes" aria-pressed="true">Notes</button>
      <button class="tb mode" type="button" data-mode="math" aria-pressed="false">Math</button>
    </div>
    <span id="read-dot" class="dot" data-source="offline" role="img" aria-label="Read offline" title="Last math line read offline"></span>
    <button id="btn-menu" class="tb" type="button" aria-label="Menu" title="Menu">&#8943;</button>
  </header>

  <aside id="sidebar" aria-label="Notes">
    <div class="sidebar-head"><strong>Notes</strong><button id="btn-new-note" class="tb" type="button">New</button></div>
    <ul id="note-list"></ul>
  </aside>

  <main id="stage">
    <canvas id="board"></canvas>
    <div id="cards"></div>
    <div id="debug" aria-hidden="true"></div>
    <div id="selbar" role="toolbar" aria-label="Selection" hidden>
      <button id="sel-dup" class="tb" type="button">Duplicate</button>
      <span id="sel-colors" role="group" aria-label="Recolor"></span>
      <button id="sel-del" class="tb" type="button">Delete</button>
    </div>
  </main>
  <div id="menu" role="menu" aria-label="Menu" hidden>
    <button id="menu-png" class="tb" type="button" role="menuitem">Export PNG</button>
    <button id="menu-pdf" class="tb" type="button" role="menuitem">Export PDF</button>
    <button id="menu-settings" class="tb" type="button" role="menuitem">Settings</button>
  </div>
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Settings</h2>
      <label class="row"><input type="checkbox" name="smartScript"> Smart Script (tidy handwriting)</label>
      <label class="row"><input type="checkbox" name="shapeSnap"> Shape snap (hold to straighten)</label>
      <label class="row"><input type="checkbox" name="debugOverlay"> Show recognized text</label>
      <label class="row">Angles <select name="angle"><option value="deg">Degrees</option><option value="rad">Radians</option></select></label>
      <label class="row">Paper <select name="paper"><option value="blank">Blank</option><option value="lined">Lined</option><option value="grid">Grid</option><option value="dots">Dots</option></select></label>
      <label class="row">Theme <select name="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label class="row">Anthropic API key <input type="password" name="apiKey" autocomplete="off" spellcheck="false" placeholder="optional"></label>
      <label class="row">Model <input type="text" name="model" autocomplete="off" spellcheck="false"></label>
      <p class="note">Math lines are sent to Anthropic as images when a key is set. The key stays in this browser.</p>
      <button class="tb" type="submit">Done</button>
    </form>
  </dialog>
  <div id="toasts" aria-live="polite"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
